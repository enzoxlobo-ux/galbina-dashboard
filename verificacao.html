<!doctype html><html lang="pt-BR" class="gaibina-entrada"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gaibina · Teste visual sem dados</title><style>
/* === BASE === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Paleta oficial Gaibina (mesma da planilha e do deck institucional):
     grafite + verde sao a ancora da marca. Azul/ambar/vermelho seguem a
     convencao semantica do design_system.md (dado/aviso/negativo). */
  --bg:       #faf9f6;
  --bg2:      #f1f0ea;
  --card:     #ffffff;
  --ink:      #3f3f3f;
  --ink-soft: #6b6b6b;
  --petrol:   #3f3f3f;  /* grafite — cor primaria da marca */
  --petrol2:  #5c5c5c;  /* cinza escuro (mesmo tom dos headers de tabela da planilha) */
  --sand:     #6fa53c;  /* verde claro — destaque secundario */
  --sand2:    #8fbf5c;
  --green:    #4f7a28;  /* verde escuro — positivo/calculado */
  --amber:    #d99a2b;  /* ambar — ja era identico a marca */
  --red:      #c0563f;  /* vermelho — ja era identico a marca */
  --line:     #e2dfd6;
  --line2:    #ece9e1;
  --muted:    #7a7a7a;
  --header-bg: rgba(255,255,255,.88);
  /* Grafite fixo pra fundo sólido com texto branco em cima (marca, botão
     primário). Não muda no tema escuro — diferente de --petrol, que lá vira
     claro porque também é usado como cor de TEXTO sobre --card. */
  --brand-solid:  #3f3f3f;
  --brand-solid2: #5c5c5c;
  --sidebar:  236px;
  --header:   62px;
  --shadow-sm: 0 1px 3px rgba(31,45,42,.06), 0 1px 2px rgba(31,45,42,.04);
  --shadow-md: 0 4px 16px rgba(31,45,42,.08), 0 2px 6px rgba(31,45,42,.04);
  --shadow-lg: 0 16px 48px rgba(31,45,42,.14);
}
/* Tema escuro — mesma identidade grafite+verde da Gaibina, só invertida.
   Ativado via [data-theme="dark"] no <html>, alternado pelo botão no header
   (index — ver JS de tema perto do fim do arquivo) e lembrado em
   localStorage. --petrol vira um neutro claro aqui porque grafite escuro em
   cima de card escuro fica ilegível — nos KPIs "petrol" é o tom neutro/
   informativo, então mantém a função, só troca de luminância. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:       #1a1a18;
  --bg2:      #222220;
  --card:     #262624;
  --ink:      #f0efe8;
  --ink-soft: #b9b7ad;
  --petrol:   #e2e0d6;
  --petrol2:  #c4c2b6;
  --sand:     #8fbf5c;
  --sand2:    #a8d47a;
  --green:    #7fb84a;
  --amber:    #e0ab4a;
  --red:      #d9765a;
  --line:     #3a3936;
  --line2:    #333230;
  --muted:    #8f8d83;
  --header-bg: rgba(26,26,24,.88);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.28), 0 1px 2px rgba(0,0,0,.2);
  --shadow-md: 0 4px 16px rgba(0,0,0,.36), 0 2px 6px rgba(0,0,0,.24);
  --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
}
body {
  font-family: 'Outfit', 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background-color .2s ease, color .2s ease;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid var(--bg2); }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* === LOADER === */
#loader { position: fixed; inset: 0; z-index: 999; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.spinner { width: 44px; height: 44px; border: 3px solid var(--line); border-top-color: var(--petrol); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { color: var(--muted); font-size: 13px; letter-spacing: .04em; font-weight: 500; }
.loader-brand { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; color: var(--petrol); letter-spacing: -.01em; }

/* === ERROR === */
#error-panel { display: none; position: fixed; inset: 0; z-index: 998; background: var(--bg); align-items: center; justify-content: center; padding: 20px; }
.error-box { background: var(--card); border: 1px solid rgba(192,86,63,.25); border-radius: 18px; padding: 44px; max-width: 520px; text-align: center; box-shadow: var(--shadow-lg); }
.error-icon { font-size: 42px; margin-bottom: 14px; }
.error-title { font-size: 19px; font-weight: 700; color: var(--red); margin-bottom: 10px; font-family: 'Fraunces', serif; }
.error-msg { color: var(--ink-soft); font-size: 13px; line-height: 1.75; white-space: pre-wrap; }
.error-retry { margin-top: 22px; padding: 10px 26px; border-radius: 9px; border: none; background: var(--brand-solid); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; letter-spacing: .02em; transition: background .15s; }
.error-retry:hover { background: var(--brand-solid2); }

/* === HEADER === */
.header { position: fixed; top: 0; left: 0; right: 0; height: var(--header); background: var(--header-bg); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 26px; gap: 18px; z-index: 100; }
.btn-theme { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background-color .15s, border-color .15s, color .15s; touch-action: manipulation; }
.btn-theme:hover { border-color: var(--petrol2); color: var(--petrol); }
.header-mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--brand-solid), var(--brand-solid2)); display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Fraunces', serif; font-weight: 700; font-size: 19px; box-shadow: var(--shadow-sm); }
.header-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); }
.header-sub { font-size: 11px; color: var(--muted); margin-top: 1px; letter-spacing: .03em; font-weight: 500; }
.header-divider { width: 1px; height: 24px; background: var(--line); }
.header-status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-soft); font-weight: 500; }
.header-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(79,122,40,.15); }
.btn-reload { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background-color .15s, border-color .15s, color .15s; display: flex; align-items: center; gap: 6px; touch-action: manipulation; }
.btn-reload:hover { border-color: var(--petrol2); color: var(--petrol); }

/* === SIDEBAR === */
.sidebar { position: fixed; top: var(--header); left: 0; bottom: 0; width: var(--sidebar); background: #2b2b2b; padding: 22px 14px; overflow-y: auto; z-index: 90; box-shadow: 2px 0 12px rgba(0,0,0,.08); }
.nav-section { font-size: 10px; font-weight: 700; color: #767676; letter-spacing: .12em; text-transform: uppercase; padding: 0 12px; margin: 22px 0 8px; }
.nav-section:first-child { margin-top: 4px; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 12px; border: none; border-radius: 10px; font-size: 13.5px; font-family: inherit; font-weight: 500; color: #adadad; background: transparent; text-align: left; cursor: pointer; transition: background .14s, color .14s, box-shadow .14s; margin-bottom: 2px; touch-action: manipulation; }
.nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav-item:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }
.nav-item.active { background: var(--green); color: #fff; box-shadow: 0 4px 14px rgba(79,122,40,.4); font-weight: 600; }
.nav-icon { font-size: 16px; width: 20px; text-align: center; }
.sidebar-foot { margin-top: 28px; padding: 14px 12px; border-top: 1px solid rgba(255,255,255,.09); }
.sidebar-foot-txt { font-size: 10.5px; color: #8c8c8c; line-height: 1.6; }

/* === MAIN === */
.main { margin-left: var(--sidebar); margin-top: var(--header); padding: 28px 34px 60px; max-width: 1500px; }

/* === FILTER BAR === */
.filter-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 14px 18px; margin-bottom: 26px; box-shadow: var(--shadow-sm); }
.filter-label { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.filter-bar select, .filter-bar input { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 13px; font-family: inherit; font-weight: 500; cursor: pointer; transition: border-color .15s; }
.filter-bar select:focus-visible, .filter-bar input:focus-visible { outline: 2px solid var(--sand); outline-offset: 1px; border-color: var(--petrol2); }
/* Filtro compacto dentro de um panel (ex: categoria/centro de custo em
   Lançamentos) — mesma linguagem visual do filter-bar, sem o card em volta. */
.mini-filtro { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 12.5px; font-family: inherit; font-weight: 500; cursor: pointer; }
.mini-filtro:focus-visible { outline: 2px solid var(--sand); outline-offset: 1px; border-color: var(--petrol2); }
.filter-sep { width: 1px; height: 26px; background: var(--line); }
.btn { padding: 8px 18px; border-radius: 8px; border: none; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background-color .15s, color .15s, border-color .15s; letter-spacing: .01em; touch-action: manipulation; }
.btn-primary { background: var(--brand-solid); color: #fff; }
.btn-primary:hover { background: var(--brand-solid2); }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn-ghost:hover { color: var(--ink); border-color: var(--muted); }
.toggle-group { display: flex; background: var(--bg2); border-radius: 9px; padding: 3px; gap: 2px; }
.toggle-opt { padding: 7px 16px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s, box-shadow .15s; border: none; background: transparent; font-family: inherit; touch-action: manipulation; }
.toggle-opt.active { background: var(--card); color: var(--petrol); box-shadow: var(--shadow-sm); }

/* === MODULE === */
.module { display: none; animation: fadeUp .4s ease; }
.module.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.mod-title { font-family: 'Fraunces', serif; font-size: 23px; font-weight: 600; color: var(--ink); letter-spacing: -.015em; }
.mod-sub { font-size: 13px; color: var(--muted); margin-top: 3px; margin-bottom: 24px; font-weight: 400; }

/* === CARDS / KPI === */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
.kpi-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
/* cols-5 só é usado no bloco de caixa quando o cliente tem entradas fora de NF
   (Que Saúde / Entradas Diversas) — sem isso o 5º card cairia sozinho na
   segunda linha. */
.kpi-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow-sm); position: relative; transition: transform .15s, box-shadow .15s; }
.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.kpi::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; border-radius: 14px 14px 0 0; background: var(--petrol2); }
.kpi.accent-green::before { background: var(--green); }
.kpi.accent-red::before { background: var(--red); }
.kpi.accent-sand::before { background: var(--sand); }
.kpi-label { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .03em; display: flex; align-items: center; gap: 6px; max-width: calc(100% - 44px); }
.kpi-icon-badge { position: absolute; top: 18px; right: 18px; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; background: var(--bg2); }
.kpi.accent-green .kpi-icon-badge { background: rgba(79,122,40,.13); }
.kpi.accent-red .kpi-icon-badge { background: rgba(192,86,63,.12); }
.kpi.accent-sand .kpi-icon-badge { background: rgba(111,165,60,.15); }
.kpi-value { font-family: 'Fraunces', serif; font-size: 27px; font-weight: 600; color: var(--ink); margin-top: 8px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi-value.green { color: var(--green); }
.kpi-value.red { color: var(--red); }
.kpi-value.sand { color: var(--sand); }
.kpi-value.petrol { color: var(--petrol); }
.kpi-foot { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; font-weight: 500; }
.kpi-foot.up { color: var(--green); }
.kpi-foot.down { color: var(--red); }

/* === GRIDS === */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; margin-bottom: 18px; }
.grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; margin-bottom: 18px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: var(--shadow-sm); }
.panel-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 4px; letter-spacing: -.01em; }
.panel-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 18px; font-weight: 400; }

/* === TABLES === */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl thead th { text-align: left; padding: 10px 12px; font-size: 10.5px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; border-bottom: 2px solid var(--line); }
.tbl thead th.r, .tbl tbody td.r { text-align: right; }
.tbl tbody td { padding: 11px 12px; border-bottom: 1px solid var(--line2); color: var(--ink-soft); font-weight: 500; }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl tbody tr:hover { background: var(--bg); }
.tbl tbody td.strong { color: var(--ink); font-weight: 600; }
.tbl-total td { border-top: 2px solid var(--line); border-bottom: none !important; font-weight: 700; color: var(--ink); background: var(--bg2); }

/* === BADGES === */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .01em; }
.badge-green { background: rgba(79,122,40,.12); color: var(--green); }
.badge-amber { background: rgba(217,154,43,.14); color: var(--amber); }
.badge-red { background: rgba(192,86,63,.12); color: var(--red); }
.badge-petrol { background: rgba(92,92,92,.12); color: var(--petrol2); }
.badge-muted { background: var(--bg2); color: var(--muted); }

/* === ALERTAS (estilo cards fintech: icone-quadrado + titulo + descricao) === */
.alert-list { display: flex; flex-direction: column; gap: 10px; }
.alert-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 11px; }
.alert-icon { width: 30px; height: 30px; min-width: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.alert-titulo { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.35; }
.alert-desc { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.alert-red { background: rgba(192,86,63,.08); }
.alert-red .alert-icon { background: rgba(192,86,63,.16); }
.alert-amber { background: rgba(217,154,43,.10); }
.alert-amber .alert-icon { background: rgba(217,154,43,.18); }

/* === STATUS PILL (saúde) === */
.health-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 24px; font-size: 14px; font-weight: 700; font-family: 'Fraunces', serif; }
.health-green { background: rgba(79,122,40,.13); color: var(--green); }
.health-amber { background: rgba(217,154,43,.15); color: var(--amber); }
.health-red { background: rgba(192,86,63,.13); color: var(--red); }

/* === PROGRESS === */
.bar-track { height: 8px; background: var(--bg2); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 5px; background: var(--petrol2); transition: width .5s ease; }
.bar-fill.green { background: var(--green); }
.bar-fill.sand { background: var(--sand); }
.bar-fill.red { background: var(--red); }

/* === CHARTS === */
.chart-wrap { position: relative; height: 280px; }
.chart-wrap.tall { height: 340px; }
.chart-wrap.short { height: 220px; }

/* === MISC === */
.empty { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 13px; }
.spacer { height: 18px; }
@media (max-width: 1100px) {
  .kpi-grid, .kpi-grid.cols-5 { grid-template-columns: repeat(2,1fr); }
  .grid-2, .grid-2-1, .grid-3 { grid-template-columns: 1fr; }
}
/* === MOBILE === */
@media (max-width: 720px) {
  .header { padding: 0 14px; gap: 10px; }
  .header-title { font-size: 15px; }
  .header-sub { display: none; }
  .header-divider { display: none; }
  .header-status { gap: 6px; font-size: 10px; }
  .btn-reload span { display: none; }
  .btn-reload { padding: 7px 10px; }

  /* Sidebar vira barra de navegação horizontal rolável, sem sair do fluxo
     (assim o <main> nao precisa de offset extra calculado à mão). */
  .sidebar {
    position: sticky;
    top: var(--header);
    left: 0; right: 0; bottom: auto;
    width: 100%;
    height: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    padding: 10px 14px;
    border-right: none;
    border-bottom: 1px solid rgba(255,255,255,.09);
  }
  .nav-section, .sidebar-foot { display: none; }
  .nav-item { flex: 0 0 auto; width: auto; white-space: nowrap; margin-bottom: 0; padding: 8px 13px; font-size: 12.5px; }

  .main { margin-left: 0; padding: 18px 14px 50px; }
  .kpi-grid, .kpi-grid.cols-3, .kpi-grid.cols-5 { grid-template-columns: 1fr; }
  .filter-bar { padding: 12px 14px; gap: 10px; }

  /* Tabelas largas (Projetos, Lançamentos) rolam dentro do card em vez de
     espremer colunas até ficar ilegível. */
  .panel { padding: 16px; overflow-x: auto; }
  /* só as tabelas realmente largas (5-6 colunas: Projetos, Vencidas, A Receber,
     Despesas a Pagar) precisam rolar — tabelas rótulo|valor (Fluxo de Caixa,
     Saldo por Conta) devem caber inteiras sem isso */
  .tbl-wide { min-width: 540px; }
}

/* === TOOLTIPS (explicação ao passar o cursor) === */
[data-tip] { position: relative; cursor: help; border-bottom: 1px dotted var(--line); width: fit-content; }
[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  left: 50%; bottom: calc(100% + 10px);
  transform: translateX(-50%) translateY(4px);
  background: var(--ink); color: #fff;
  font-family: 'Outfit', sans-serif; font-size: 11.5px; font-weight: 500; line-height: 1.5;
  letter-spacing: 0; text-transform: none;
  padding: 9px 12px; border-radius: 9px;
  width: max-content; max-width: 230px; text-align: left;
  box-shadow: var(--shadow-md);
  opacity: 0; visibility: hidden;
  transition: opacity .15s ease, transform .15s ease;
  z-index: 300; pointer-events: none;
}
[data-tip]::before {
  content: '';
  position: absolute;
  left: 50%; bottom: calc(100% + 4px);
  transform: translateX(-50%);
  border: 5px solid transparent; border-top-color: var(--ink);
  opacity: 0; visibility: hidden;
  transition: opacity .15s ease;
  z-index: 300; pointer-events: none;
}
[data-tip]:hover::after, [data-tip]:hover::before { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
.kpi-label[data-tip], .panel-title[data-tip] { display: inline-flex; }
@media (hover: none) {
  [data-tip] { border-bottom-style: dotted; }
  [data-tip]:hover::after, [data-tip]:hover::before { display: none; }
}
.skip-link { position:fixed; left:12px; top:-60px; z-index:1100; padding:10px 14px; border-radius:8px; background:var(--brand-solid); color:#fff; font-weight:700; text-decoration:none; }
.skip-link:focus { top:10px; }

/* === PÁGINA EXECUTIVA ===
   A direção pediu uma leitura única, sem navegação por módulos. Mantemos os
   módulos antigos no arquivo (motor/fallback), mas a apresentação oficial é
   esta página consolidada. */
.sidebar, .module { display: none !important; }
.main { margin-left: 0; max-width: 1680px; margin-right: auto; padding: 24px 32px 56px; }
.filter-bar { margin-bottom: 18px; padding: 10px 14px; box-shadow: none; }
.filter-bar label[for="filter-mes"], .filter-bar #filter-mes,
.filter-bar label[for="filter-conta"], .filter-bar #filter-conta { display: none; }
.exec-page { display: block; }
.exec-tabs { display:flex; gap:6px; padding:5px; width:max-content; max-width:100%; border:1px solid var(--line); background:var(--card); border-radius:12px; margin-bottom:24px; }
.exec-tab { border:0; border-radius:8px; background:transparent; color:var(--ink-soft); padding:11px 20px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; }

<style>
html.gaibina-entrada body { overflow:hidden; }
html.gaibina-entrada body > :not(#entrada-visual):not(script):not(style):not(noscript) { visibility:hidden!important; }
#entrada-visual { position:fixed;inset:0;z-index:100000;display:grid;place-items:center;background:var(--bg);padding:24px;overflow:auto; }
#entrada-visual[hidden] { display:none; }
.entrada-cartao { width:min(100%,420px);padding:36px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--sand);border-radius:12px;box-shadow:var(--shadow-md); }
.entrada-marca { color:var(--green);font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase; }
.entrada-cartao h1 { font-size:28px;margin:18px 0 10px;line-height:1.2; }
.entrada-cartao p { color:var(--ink-soft);line-height:1.5;margin-bottom:22px; }
.entrada-cartao label { display:block;font-size:14px;font-weight:600;margin-bottom:8px; }
.entrada-cartao input { width:100%;padding:13px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit; }
.entrada-cartao button { width:100%;margin:16px 0;padding:13px;border:0;border-radius:6px;background:var(--brand-solid);color:white;font:inherit;font-weight:600;cursor:pointer; }
.entrada-cartao :focus-visible { outline:3px solid var(--sand);outline-offset:3px; }
.entrada-aviso { display:block;font-size:12px;line-height:1.5;color:var(--muted); }
#entrada-erro { min-height:22px;color:var(--red);margin:10px 0 0;font-size:14px; }
#entrada-sair { position:fixed;right:16px;bottom:16px;z-index:9999;padding:9px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:var(--shadow-sm); }
@media(max-width:480px) { .entrada-cartao { padding:26px; } }
@media print { #entrada-sair {display:none;} html.gaibina-entrada body>*:not(#entrada-visual){display:none!important;} }
</style>
<section id="entrada-visual" aria-labelledby="entrada-titulo">
  <form class="entrada-cartao" id="entrada-form">
    <div class="entrada-marca">Gaibina · Painel financeiro</div>
    <h1 id="entrada-titulo">Horda · teste visual</h1>
    <p>Informe o código fornecido pela Gaibina para abrir o dashboard.</p>
    <label for="entrada-codigo">Código de entrada</label>
    <input id="entrada-codigo" type="password" autocomplete="off" required spellcheck="false" aria-describedby="entrada-erro entrada-aviso">
    <div id="entrada-erro" role="status" aria-live="polite"></div>
    <button type="submit">Entrar</button>
    <small class="entrada-aviso" id="entrada-aviso">Controle de entrada visual. Não constitui autenticação segura.</small>
  </form>
</section>
<button id="entrada-sair" type="button" hidden>Sair</button>
<noscript>Ative o JavaScript para usar o dashboard. O código de entrada é apenas um controle visual.</noscript>
<script>
/* Não é autenticação: o HTML e seus dados permanecem acessíveis publicamente. */
(() => {
  const esperado = "b55f13d23afd9a0d06abe2ea07cfce10c6f2bea8d0fdbb15c48717c866a41945";
  const chave = "gaibina-preview-v1";
  const tela=document.getElementById('entrada-visual');
  const sair=document.getElementById('entrada-sair');
  const campo=document.getElementById('entrada-codigo');
  function liberar() {
    document.documentElement.classList.remove('gaibina-entrada');
    tela.hidden=true; sair.hidden=false; campo.value='';
    document.querySelector('.header-title')?.setAttribute('tabindex','-1');
    document.querySelector('.header-title')?.focus();
    window.dispatchEvent(new Event('resize'));
  }
  function bloquear() {
    document.documentElement.classList.add('gaibina-entrada');
    tela.hidden=false; sair.hidden=true;
    document.getElementById('entrada-erro').textContent='';
    campo.value=''; campo.focus();
  }
  try { if(sessionStorage.getItem(chave)===esperado) liberar(); else bloquear(); } catch(_) { bloquear(); }
  document.getElementById('entrada-form').addEventListener('submit',async e=>{
    e.preventDefault();
    try {
      const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(campo.value.trim()));
      const hash=Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');
      if(hash!==esperado) {
        document.getElementById('entrada-erro').textContent='Código não reconhecido. Confira e tente novamente.';
        campo.select(); return;
      }
      try {sessionStorage.setItem(chave,esperado);}catch(_){}
      liberar();
    } catch(_) {
      document.getElementById('entrada-erro').textContent='Abra o link HTTPS do dashboard em um navegador atualizado.';
    }
  });
  sair.addEventListener('click',()=>{try{sessionStorage.removeItem(chave);}catch(_){} bloquear();});
})();
</script>
<main style="padding:40px"><h2>Teste visual concluído</h2><p>Esta página não contém dados financeiros.</p></main></body></html>
